<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  
  <style>
    .logo-face {
      fill: black;
    }
    .logo-left-eye {
      fill: white;
      
    }
    .logo-right-eye {
      fill: white;
    }
    .logo-scar {
      fill: white;
    }

  </style>
  
</head>

<body>
  <svg
    width="200"
    height="200"
    viewBox="0 0 100 100"
  >
   <circle
    class="logo-face"
    fill="currentColor"
    cx="50"
    cy="50"
    r="40"
    />
    
    <circle
     class="logo-left-eye"
     fill="currentColor"
     cx="30"
     cy="50"
     r="10"
     />
     
    <path
     class="logo-right-eye"
     fill="currentColor"
     d="M 60 50 A 10 5 0 0 0 80 50 Z"
    />
    
    <path
     class="logo-scar"
     fill="currentColor"
     d="M 70 50 L 70 30 L 75 50 L 70 70 Z"
    />
  </svg>
  <svg class="menu"
    width="100"
    height="100"
    viewBox="200 200 200 200">
    <path class="menu-bars"
     d="M 160 175 L 180 175"
    />
    
  </svg>
</body>

</html>
