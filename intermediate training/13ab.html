<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>13a exercise</title>
  
  <style>
    
   .new-main {
     display: flex;
     flex-direction: row;
     height: 50px;
     margin-bottom: 10px;
   }
   .item1 {
     background-color: lightpink;
     width: 100px;
     display: flex;
     justify-content: center;
     flex-direction: row;
     align-items: center;
   }
   
   .item {
     color: #EDEDED;
     background-color: #252525;
   }
   .item2 {
     background-color: lightblue;
     width: 200px;
   }
   
   .item3 {
     background-color: lightblue;
     width: 200px;
     display: flex;
     justify-content: space-between;
     align-items: center;
   }
   p {
     margin: 0;
   }
   .row-two {
     color: #EDEDED;
     background-color: #252525;
   }
    
  </style>
  
</head>



<body>
  <div class="new-main">
    <div class="item1">
      <p class="item">item 1</p>
    </div>
    <div class="item2">
    </div>
  </div>
  
<div class="new-main">
    <div class="item1">
    </div>
    <div class="item3">
      <div>
        <p>row 1</p>
        <p class="row-two">row 2</p>
      </div>
      <div>
        <p class="row-two">row 2</p>
      </div>
    </div>
</div>
  
</body>

</html>
