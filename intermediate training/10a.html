<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>10a exercise</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  
  <style>
    .exercise {
      width: 300px;
      height: 50px;
      border: none;
      
    }
    .profile-pic {
      padding-left: 5px;
      padding-bottom: 5px;
      padding-top: 5px;
      padding-right: 5px;
      vertical-align: middle;
      display: inline-block;
    }
    .picture {
      width: 40px;
      object-fit: cover;
      height: 40px;
      border-radius: 20px;
    }
    .profile-info {
      font-size: 10px;
      display: inline-block;
      vertical-align: middle;
      width: 50px;
    }
    .name {
      font-weight: bold;
      margin-left: 0px;
      margin-right: 0px;
      margin-top: 0px;
      margin-bottom: 3px;
    }
    .species {
      color: rgba(108, 108, 108, 1);
      margin-left: 0px;
      margin-right: 0px;
      margin-top: 0px;
      margin-bottom: 3px;
    }
    .status {
      color: rgba(108, 108, 108, 1);
      margin-left: 0px;
      margin-right: 0px;
      margin-top: 0px;
      margin-bottom: 3px;
      font-style: italic;

    }
    
    .profile-button {
      vertical-align: middle;
      display: inline-block;
      margin-left: 130px;
    }
    .follow-button {
      background-color: #0F74BA;
      border: none;
      color: white;
      border-radius: 2px;
      font-size: 12px;
      padding-bottom: 5px;
      padding-top: 5px;
    }
    
  </style>
  
</head>

<body>
 <div class="exercise">
  <div class="profile-pic">
    <img class="picture" src="photos/dawg.jpg" alt="dawg pic">
  </div>
  <div class="profile-info">
    <p class="name">
      Dawg
    </p>
    <p class="species">
      The Dog
    </p>
    <p class="status">
      Low-key
    </p>
  </div>
  <div class="profile-button">
    <button class="follow-button">
    Follow
    </button>
  </div>
 </div>
 
 
  <div class="exercise">
  <div class="profile-pic">
    <img class="picture" src="photos/lego.jpg" alt="dawg pic">
  </div>
  <div class="profile-info">
    <p class="name">
      Lego Guy
    </p>
    <p class="species">
      The Lego
    </p>
    <p class="status">
      In love
    </p>
  </div>
  <div class="profile-button">
    <button class="follow-button">
    Follow
    </button>
  </div>
 </div>
 
  <div class="exercise">
   <div class="profile-pic">
     <img class="picture" src="photos/sad boi.jpg" alt="dawg pic">
   </div>
   <div class="profile-info">
     <p class="name">
       Sad Boi
     </p>
     <p class="species">
       The Man
     </p>
     <p class="status">
       Depressed
     </p>
   </div>
   <div class="profile-button">
     <button class="follow-button">
       Follow
     </button>
   </div>
 </div>
 
 <i class="fa-solid fa-circle-arrow-down"></i>
 
 
 
 
</body>


</html>
