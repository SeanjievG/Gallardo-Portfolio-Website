<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>12abcd</title>
  
  <style>
    
    div {
      display: flex;
      flex-direction: row;
      font-family: Times;
    }
    
    .twelve-a {
      margin-bottom: 10px;
    }
    .one {
      background-color: lightblue;
      width: 200px;
    }
    .two {
      background-color: lightpink;
      width: 75px;
    }
    
    .twelve-b {
      margin-bottom: 10px;
    }
    
    .item-one, .item-three {
      background-color: lightblue;
    }
    .item-one {
      width: 50px;
    }
    .item-two {
      background-color: lightpink;
      flex: 1;
    }
    .item-three {
      width: 75px;
    }
    
    .twelve-c {
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .item-a, .item-c, .itemOne {
      background-color: lightblue;
    }
    .item-b, .item-d, .itemTwo {
      background-color: lightpink;
    }
   
   .twelve-d {
     height: 50px;
     border-width: 1px;
     border-style: solid;
     border-color: #6B6B6B;
     border-radius: 5px;
     justify-content: space-between;
     align-items: center;
   }
    
    
  </style>
  
</head>

<body>
  <div class="twelve-a">
    <div class="one">200px</div>
    <div class="two">75px</div>
  </div>
  
  <div class="twelve-b">
    <div class="item-one">
      item 1
    </div>
    <div class="item-two">
      item 2
    </div>
    <div class="item-three">
      item 3
    </div>
  </div>
   
  <div class="twelve-c">
    <div class="item-a">
      item a
    </div>
    <div class="item-b">
      item b 
    </div>
    <div class="item-c">
      item c
    </div>
    <div class="item-d">
      item d
    </div>
  </div>
  
  <div class="twelve-d">
    <div class="itemOne">
      item1
    </div>
    <div class="itemTwo">
      item2
    </div>
  </div>
</body>

</html>
