<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>10d exercise</title>
  
  <style>
  
    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      column-gap: 5px;
      row-gap: 10px;
    }
    
    .facebook-clone {
      width: 112px;
      height: 175px;
      box-shadow: 0px 0px 5px rgba(129, 129, 129, .5);
    }
    .profile-pic {
      width:112px;
      height: 107px;
    }
    .picture {
      width:100%;
      height: 100%;
      object-fit: cover;
    }
    p {
      margin-top: 0px;
      margin-bottom: 0px;
      margin-left: 0px;
      margin-right: 0px;
    }
    .profile-info {
      width: 112px;
      height: 63px;
      margin-left: 5px;
    }
    .name {
      font-weight: 700;
      font-size: 13px;
    }
    .mutual-info {
      width: 112px;
      height: 15px;
    }
    .info {
      font-size: 10px;
      display: inline-block;
      color: rgba(83, 83, 83, 1);
    }
    .mutual-friend {
      display: inline-block;
      object-fit: cover;
      width: 20px;
      height: 20px;
      border-radius: 10px;
      vertical-align: middle;
    }
    .active {
      display: block;
      font-size: 10px;
      margin-top: 10px;
      margin-bottom: 5px;
      color: white;
      border: none;
      border-radius: 2px;
      background-color: rgba(29, 101, 155, 1);
      padding-left:10px ;
      padding-right:10px ;
      padding-top: 3px;
      padding-bottom: 3px;
      cursor: pointer;
      transition: opacity .15s;
    }
    .active:hover {
      opacity: 80%;
    }
    
  </style>
  
</head>

<body>
 <div class="grid-container">
   
 <div class="facebook-clone">
  <div class="profile-pic">
    <img class="picture"src="photos/dawg.jpg" alt="dawg cool pic">
  </div>
  <div class="profile-info">
    <p class="name">
      Dawg
    </p>
    <div class="mutual-info">
     <img class="mutual-friend" src="photos/seanjiev.jpg" alt="Seanjiev's pic">
     <p class="info">
      2 mutual friends
     </p>
    </div class="button">
    <button class="active">
      Add Friend
    </button>
  </div>
 </div>
  
 <div class="facebook-clone">
  <div class="profile-pic">
    <img class="picture"src="photos/sad boi.jpg" alt="sad boi pic">
  </div>
  <div class="profile-info">
    <p class="name">
      Sad Boi
    </p>
    <div class="mutual-info">
     <img class="mutual-friend" src="photos/seanjiev.jpg" alt="Seanjiev's pic">
     <p class="info">
      3 mutual friends
     </p>
    </div class="button">
    <button class="active">
      Add Friend
    </button>
  </div>
 </div>
 
  <div class="facebook-clone">
   <div class="profile-pic">
     <img class="picture" src="photos/lego.jpg" alt="lego cool pic">
   </div>
   <div class="profile-info">
     <p class="name">
       Lego Guy
     </p>
     <div class="mutual-info">
       <img class="mutual-friend" src="photos/hero.jpg" alt="Saitama pic">
       <p class="info">
         1 mutual friends
       </p>
     </div class="button">
     <button class="active">
       Add Friend
     </button>
   </div>
 </div>

   <div class="profile-pic">
     <img class="picture" src="photos/lego.jpg" alt="lego cool pic">
   </div>
   <div class="profile-info">
     <p class="name">
       Lego Guy
     </p>
     <div class="mutual-info">
       <img class="mutual-friend" src="photos/hero.jpg" alt="Saitama pic">
       <p class="info">
         1 mutual friends
       </p>
     </div class="button">
     <button class="active">
       Add Friend
     </button>
   </div>
 </div>
 
 </div>
</body>

</html>
